name: CI

on:
  push:
    branches:
      - main
      - master
      - 'generic-*'
  pull_request:
    branches:
      - main
      - master
      - 'generic-*'

jobs:
  ci:
    name: Codegen diff + tests + cross-compile smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for git diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pytest

      - name: Install arm-none-eabi-gcc (aspirational; non-blocking)
        # continue-on-error: true so the job does not fail if apt-get is slow or
        # unavailable — scripts/ci_check.sh step 4 echo-skips when the toolchain
        # is absent, consistent with the "aspirational" cross-compile policy.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Run CI check script
        run: bash scripts/ci_check.sh
