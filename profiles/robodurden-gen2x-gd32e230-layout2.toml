# Captured from RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32 (TARGET=3, LAYOUT=2)
# Source: defines_2-3-2.h
# GD32E230 LAYOUT 2 — standard phase pin order (vs reversed in LAYOUT 1).
# Buzzer on uncommon PF0 pin.

[meta]
name = "RoboDurden Gen2.x GD32E230 LAYOUT 2 (standard phase order)"
source = "imported-from-RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32"
notes = "Standard phase pin order. Buzzer on PF0. No CHARGE_STATE defined in this layout."
confidence = 1.0

[chip]
family = "GD32E2"
part_hint = "GD32E230C8T6"

[power]
self_hold = "PB2"
self_hold_active_high = true

[halls_right]
hall_a = "PC14"
hall_b = "PB11"
hall_c = "PA1"

[phases_right]
timer = "TIMER0"
u_high = "PA8"
u_low = "PB13"
v_high = "PA9"
v_low = "PB14"
w_high = "PA10"
w_low = "PB15"
dead_time_ns = 833

[indicators]
led_red = "PB4"
led_orange = "PA15"
led_green = "PB3"
buzzer = "PF0"

[inputs]
button = "PA5"
button_active_low = true

[sensing.battery_voltage]
adc_unit = 1
channel = 4
on_pin = { port = "A", pin = 4 }
divider = 13.0

[sensing.left_phase_current]
adc_unit = 1
channel = 6
on_pin = { port = "A", pin = 6 }
shunt_resistor_milliohms = 1.0
