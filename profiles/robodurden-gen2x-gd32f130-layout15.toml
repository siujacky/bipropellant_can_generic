# Captured from RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32 (TARGET=1, LAYOUT=15)
# Source: defines_2-1-15.h
# GD32F130 LAYOUT 15 — Substantially different pinout: no LEDs, self-hold on PC13,
# BUTTON on PB2 (where self-hold usually lives), VBATT on PB1 (not PA4), CURRENT_DC on PA7.

[meta]
name = "RoboDurden Gen2.x-GD32 LAYOUT 1-15 (no LEDs, PC13 self-hold)"
source = "imported-from-RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32"
notes = "Source comment says 'Layout 2-17 doesn't have any LEDs on Master or Slave'. Self-hold relocated to PC13. Button on PB2 (the typical self-hold pin). VBATT/CURRENT_DC on uncommon PB1/PA7."
confidence = 0.95

[chip]
family = "GD32F1"
part_hint = "GD32F130C8T6"

[power]
self_hold = "PC13"
self_hold_active_high = true

[halls_right]
hall_a = "PF1"
hall_b = "PA0"
hall_c = "PC15"

[phases_right]
timer = "TIMER0"
u_high = "PA8"
u_low = "PB13"
v_high = "PA9"
v_low = "PB14"
w_high = "PA10"
w_low = "PB15"
dead_time_ns = 833

[indicators]
buzzer = "PC14"

[inputs]
button = "PB2"
button_active_low = true
charger_detect = "PF0"
charger_active_low = true

[sensing.battery_voltage]
adc_unit = 1
channel = 9
on_pin = { port = "B", pin = 1 }
divider = 13.0

[sensing.left_phase_current]
adc_unit = 1
channel = 7
on_pin = { port = "A", pin = 7 }
shunt_resistor_milliohms = 1.0
