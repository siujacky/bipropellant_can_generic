# Captured from RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32 (TARGET=1, LAYOUT=16)
# Source: defines_2-1-16.h
# GD32F130 LAYOUT 16 — like LAYOUT 1-1 but LED color assignments differ.

[meta]
name = "RoboDurden Gen2.x-GD32 LAYOUT 1-16 (alt LED color mapping)"
source = "imported-from-RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32"
notes = "Halls and IO match LAYOUT 1-1. LED_GREEN=PA15, LED_ORANGE=PA12, LED_RED=PB3 — different color mapping vs LAYOUT 1-1."
confidence = 1.0

[chip]
family = "GD32F1"
part_hint = "GD32F130C8T6"

[power]
self_hold = "PB2"
self_hold_active_high = true

[halls_right]
hall_a = "PC14"
hall_b = "PF1"
hall_c = "PB11"

[phases_right]
timer = "TIMER0"
u_high = "PA8"
u_low = "PB13"
v_high = "PA9"
v_low = "PB14"
w_high = "PA10"
w_low = "PB15"
dead_time_ns = 833

[indicators]
led_green = "PA15"
led_orange = "PA12"
led_red = "PB3"
buzzer = "PB10"

[inputs]
button = "PC15"
button_active_low = true
charger_detect = "PF0"
charger_active_low = true

[sensing.battery_voltage]
adc_unit = 1
channel = 4
on_pin = { port = "A", pin = 4 }
divider = 13.0

[sensing.left_phase_current]
adc_unit = 1
channel = 6
on_pin = { port = "A", pin = 6 }
shunt_resistor_milliohms = 1.0
