# Captured from RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32 (TARGET=1, LAYOUT=7)
# Source: defines_2-1-7.h
# GD32F130 with HALL A/B swapped vs LAYOUT 1-6.

[meta]
name = "RoboDurden Gen2.x-GD32 LAYOUT 1-7 (GD32F130, alt hall A/B)"
source = "imported-from-RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32"
notes = "Hall A on PB11, Hall B on PC14 (swapped from LAYOUT 1-6). Standard everything else."
confidence = 1.0

[chip]
family = "GD32F1"
part_hint = "GD32F130C8T6"

[power]
self_hold = "PB2"
self_hold_active_high = true

[halls_right]
hall_a = "PB11"
hall_b = "PC14"
hall_c = "PA1"

[phases_right]
timer = "TIMER0"
u_high = "PA8"
u_low = "PB13"
v_high = "PA9"
v_low = "PB14"
w_high = "PA10"
w_low = "PB15"
dead_time_ns = 833

[indicators]
led_red = "PB4"
led_orange = "PA15"
led_green = "PB3"
buzzer = "PB9"

[inputs]
button = "PA5"
button_active_low = true
charger_detect = "PC15"
charger_active_low = true

[sensing.battery_voltage]
adc_unit = 1
channel = 4
on_pin = { port = "A", pin = 4 }
divider = 13.0

[sensing.left_phase_current]
adc_unit = 1
channel = 6
on_pin = { port = "A", pin = 6 }
shunt_resistor_milliohms = 1.0
