# Captured from RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32 (TARGET=1, LAYOUT=11)
# Source: defines_2-1-11.h
# Essentially LAYOUT 1-10 with CHARGE_STATE defined on PF0.

[meta]
name = "RoboDurden Gen2.x-GD32 LAYOUT 1-11 (LAYOUT 1-10 + charger)"
source = "imported-from-RoboDurden/Hoverboard-Firmware-Hack-Gen2.x-GD32"
notes = "Same as LAYOUT 1-10 but adds CHARGE_STATE on PF0."
confidence = 1.0

[chip]
family = "GD32F1"
part_hint = "GD32F130C8T6"

[power]
self_hold = "PB2"
self_hold_active_high = true

[halls_right]
hall_a = "PB11"
hall_b = "PC14"
hall_c = "PF1"

[phases_right]
timer = "TIMER0"
u_high = "PA8"
u_low = "PB13"
v_high = "PA9"
v_low = "PB14"
w_high = "PA10"
w_low = "PB15"
dead_time_ns = 833

[indicators]
led_red = "PB3"
led_orange = "PA12"
led_green = "PA15"
buzzer = "PB10"

[inputs]
button = "PC15"
button_active_low = true
charger_detect = "PF0"
charger_active_low = true

[sensing.battery_voltage]
adc_unit = 1
channel = 4
on_pin = { port = "A", pin = 4 }
divider = 13.0

[sensing.left_phase_current]
adc_unit = 1
channel = 6
on_pin = { port = "A", pin = 6 }
shunt_resistor_milliohms = 1.0
